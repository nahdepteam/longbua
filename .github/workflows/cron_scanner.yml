name: Bybit MACD Super Hourly Scanner

on:
  repository_dispatch:
    types: [trigger-scan]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cai dat Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Chay Script Quet MACD
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scanner.js
